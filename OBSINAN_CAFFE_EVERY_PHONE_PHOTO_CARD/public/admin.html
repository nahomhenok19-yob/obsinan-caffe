<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBSINAN Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" style="min-height:100vh;display:grid;place-items:center;padding:30px"><form id="loginForm"><span class="kicker">OBSINAN CAFFE</span><h2>Admin <em>Panel</em></h2><input id="pass" type="password" placeholder="Admin password" required><button class="btn">Login</button><p id="err"></p></form></div>
<div id="dash" hidden><header><a class="brand" href="/">OBSINAN <b>ADMIN</b></a><nav><a href="/">Website</a><button id="theme" class="theme">◐</button><a href="#" onclick="logout()">Logout</a></nav></header><section><span class="kicker">CONTROL CENTER</span><h2>Dashboard</h2><div id="stats" class="cards"></div><h2>All <em>Bookings</em></h2><div id="bookings" class="cards"></div><h2>Menu <em>Management</em></h2><form id="menuForm"><input name="name" placeholder="Item name" required><input name="category" placeholder="Category" required><input name="price" type="number" placeholder="Price ETB" required><input name="image" placeholder="Photo URL"><input name="description" placeholder="Description"><button class="btn">Add Item</button></form><div id="adminMenu" class="cards" style="margin-top:25px"></div><h2>Change <em>Password</em></h2><form id="pw"><input id="current" type="password" placeholder="Current password" required><input id="newp" type="password" placeholder="New password (8+)" required><input id="confirm" type="password" placeholder="Confirm new password" required><button class="btn">Change Password</button><p id="pwmsg"></p></form></section></div><script src="admin.js"></script></body></html>
